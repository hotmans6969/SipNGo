name: Build Android app

# Builds the installable APK. The app is a Trusted Web Activity: a thin Android
# wrapper that opens the deployed site inside Chrome with no browser chrome.
# Chrome is what makes Web Push work — Android's plain WebView has no Push API.
#
# Day-to-day content and UI changes do NOT need a new APK. The app loads the
# live site, so deploying updates every installed phone. Rebuild only when the
# icon, name, permissions, or the URL it opens change.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL the app should open (blank = the default in android/gradle.properties)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK packages this project targets
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore the signing keystore
        # Signing with a stable key is what lets assetlinks.json verify, which
        # is what hides Chrome's address bar. Without the secrets the build
        # falls back to debug signing: it still installs and still delivers
        # push, but the URL bar stays visible.
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sipngo.keystore"
            echo "path=$RUNNER_TEMP/sipngo.keystore" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - falling back to debug signing, so the URL bar will be visible."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SERVER_URL: ${{ inputs.server_url }}
        # Git on Windows does not record the executable bit, so gradlew can
        # arrive here unexecutable.
        run: |
          chmod +x ./gradlew
          ARGS=""
          if [ -n "$SERVER_URL" ]; then
            HOST=$(echo "$SERVER_URL" | sed -E 's#^https?://##' | cut -d/ -f1)
            ARGS="-PsipngoUrl=$SERVER_URL -PsipngoHost=$HOST"
            echo "Targeting $SERVER_URL"
          fi
          # Gradle's output is captured so a failure can be surfaced as a
          # workflow annotation. Run logs are not readable without a token,
          # which makes a bare "exit code 1" impossible to diagnose.
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace $ARGS 2>&1 | tee gradle-output.txt; then
            echo "::group::Gradle failure"
            grep -A 20 -E "What went wrong|FAILURE:|error:" gradle-output.txt | head -60 || tail -60 gradle-output.txt
            echo "::endgroup::"
            SUMMARY=$(grep -A 6 "What went wrong" gradle-output.txt | head -8 | paste -sd' ' -)
            echo "::error::${SUMMARY:-see the Gradle failure group above}"
            exit 1
          fi

      - name: Report what was built
        working-directory: android
        # Prints the certificate the APK is actually signed with next to the
        # fingerprint assetlinks.json expects. If those differ, the URL bar
        # stays visible, and this step is where that becomes obvious.
        run: |
          echo "URL baked into this build:"
          grep -E "sipngoUrl|sipngoHost" gradle.properties
          echo
          echo "Certificate this APK is signed with:"
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/release/app-release.apk \
            | grep -i "SHA-256" || echo "(could not read certificate)"
          echo
          echo "Fingerprint assetlinks.json expects:"
          grep -o '[0-9A-F][0-9A-F]\(:[0-9A-F][0-9A-F]\)\{31\}' ../public/.well-known/assetlinks.json || true

      - name: Name the artifact after the commit
        id: name
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sipngo-twa-${{ steps.name.outputs.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
