name: Build Android app

# Builds the installable APK in the cloud rather than on a developer machine.
# Run it from the Actions tab, or let it run on a push that touches the app
# shell. Note that day-to-day content and UI changes do NOT need a new APK:
# the app loads the live site, so deploying to Railway updates every installed
# phone. Rebuild only when the icon, name, permissions, or Capacitor config
# change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android.yml"
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Sync Capacitor
        # Copies capacitor.config.ts, including the server URL the shell points
        # at, into the native project.
        run: npx cap sync android

      - name: Show the URL baked into this build
        run: cat android/app/src/main/assets/capacitor.config.json

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the artifact after the commit
        id: name
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sipngo-debug-${{ steps.name.outputs.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
