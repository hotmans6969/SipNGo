name: Build Android app

# Builds the installable APK in the cloud rather than on a developer machine.
# Run it from the Actions tab, or let it run on a push that touches the app
# shell. Note that day-to-day content and UI changes do NOT need a new APK:
# the app loads the live site, so deploying updates every installed
# phone. Rebuild only when the icon, name, permissions, or Capacitor config
# change.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL the app should open (blank = the default in capacitor.config.ts)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android.yml"
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK packages this project targets
        # variables.gradle pins compileSdk/targetSdk to 36. Installing them up
        # front makes the build deterministic instead of relying on Gradle's
        # auto-download.
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      - name: Sync Capacitor
        # Copies capacitor.config.ts, including the server URL the shell points
        # at, into the native project. Supplying server_url when running the
        # workflow by hand builds an APK against a different host without
        # editing any code — useful when moving between deployments.
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url }}

      - name: Show the URL baked into this build
        run: cat android/app/src/main/assets/capacitor.config.json

      - name: Build debug APK
        working-directory: android
        # Git on Windows does not record the executable bit, so gradlew can
        # arrive here unexecutable. The mode is fixed in the repository too;
        # this keeps the build working regardless.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the artifact after the commit
        id: name
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sipngo-debug-${{ steps.name.outputs.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
