plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sipngo.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.sipngo.app"
        // A Trusted Web Activity needs Chrome's TWA support, which is API 21+.
        // 24 matches what the app previously shipped.
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "2.0"

        // Consumed by strings.xml and the manifest, so the site the app opens
        // is declared in exactly one place.
        resValue "string", "app_name", "SipNGo"
        resValue "string", "launch_url", project.property("sipngoUrl")
        resValue "string", "host_name", project.property("sipngoHost")
    }

    signingConfigs {
        release {
            // Populated from environment variables in CI. Without them the
            // build falls back to debug signing, which still installs but
            // will not match assetlinks.json, so the URL bar stays visible.
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("ANDROID_KEYSTORE_FILE")
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's official TWA support library. It launches the site inside
    // Chrome with no browser chrome, which is what makes Web Push work.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
