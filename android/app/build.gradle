plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sipngo.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.sipngo.app"
        // A Trusted Web Activity needs Chrome's TWA support, which is API 21+.
        // 24 matches what the app previously shipped.
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "3.0"

        // The site the app opens, declared once in gradle.properties and
        // overridable with -PsipngoUrl. project.property returns an Object, so
        // these are converted explicitly rather than relying on coercion.
        def launchUrl = project.property("sipngoUrl").toString()
        def launchHost = project.property("sipngoHost").toString()

        resValue "string", "app_name", "SipNGo"
        resValue "string", "launch_url", launchUrl

        // The intent-filter host goes in as a manifest placeholder rather than
        // a @string reference: App Links verification requires a literal host,
        // and a resource reference there fails the manifest merger.
        manifestPlaceholders = [hostName: launchHost]
    }

    signingConfigs {
        release {
            // Populated from environment variables in CI. Without them the
            // build falls back to debug signing, which still installs but
            // will not match assetlinks.json, so the URL bar stays visible.
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = System.getenv("ANDROID_KEYSTORE_FILE")
                ? signingConfigs.getByName("release")
                : signingConfigs.getByName("debug")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's official TWA support library. It launches the site inside
    // Chrome with no browser chrome, which is what makes Web Push work.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
